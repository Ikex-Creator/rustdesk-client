            }
            foreach ($argument in @(
              'sign', '/fd', 'SHA256',
              '/tr', 'http://timestamp.acs.microsoft.com', '/td', 'SHA256',
              '/dlib', $DlibPath, '/dmdf', $MetadataPath, $CandidatePath
