            while (-not $current.Equals($root, [StringComparison]::OrdinalIgnoreCase)) {
              try {
                $directory = Get-Item -LiteralPath $current -Force -ErrorAction Stop
              } catch {
                throw 'The ambient federated-token path contains an unavailable directory.'
              }
              if (-not $directory.PSIsContainer -or
                  ($directory.Attributes -band [IO.FileAttributes]::ReparsePoint) -ne 0) {
                throw 'The ambient federated-token path contains an unsafe directory.'
              }
              $parent = [IO.Path]::GetDirectoryName($current)
              if ([string]::IsNullOrWhiteSpace($parent) -or $parent -ceq $current) {
                throw 'The ambient federated-token path did not terminate at runner temp.'
              }
              $current = $parent
            }
            try {
              $item = Get-Item -LiteralPath $fullPath -Force -ErrorAction Stop
            } catch {
              throw 'The ambient federated-token file is unavailable.'
            }
            if ($item.PSIsContainer -or
                ($item.Attributes -band [IO.FileAttributes]::ReparsePoint) -ne 0 -or
                $item.Length -lt 128 -or $item.Length -gt 32768) {
              throw 'The ambient federated-token file is unsafe.'
            }
            try {
              Remove-Item -LiteralPath $fullPath -Force -ErrorAction Stop
              $survived = Test-Path -LiteralPath $fullPath -ErrorAction Stop
            } catch {
              throw 'The ambient federated-token file could not be removed.'
            }
            if ($survived) {
              throw 'The ambient federated-token file survived removal.'
            }
          }

          '@
          [IO.File]::AppendAllText(
            $scriptPath,
            $fragment + [Environment]::NewLine,
            [Text.UTF8Encoding]::new($false)
          )

      - name: Stage exact signer program part 4 of 4
        shell: pwsh
        run: |
          $scriptPath = Join-Path $env:RUNNER_TEMP 'symplifiedit-artifact-signer.ps1'
          $item = Get-Item -LiteralPath $scriptPath -Force -ErrorAction Stop
          if ($item.PSIsContainer -or
              ($item.Attributes -band [IO.FileAttributes]::ReparsePoint) -ne 0) {
            throw 'The private signer program path is unsafe.'
          }
          $fragment = @'
          $runnerTemp = [IO.Path]::GetFullPath($env:RUNNER_TEMP).TrimEnd('\', '/')
          $toolsRoot = Join-Path $runnerTemp 'symplifiedit-offline-signing-tools'
          $candidateRoot = Join-Path $runnerTemp 'symplifiedit-signing-candidates'
          $metadataRoot = Join-Path $runnerTemp 'symplifiedit-artifact-signing-metadata'
          $tokenRoot = Join-Path $runnerTemp 'symplifiedit-workload-identity'
          $dotnetHome = Join-Path $runnerTemp 'symplifiedit-dotnet-home'
          $metadataPath = Join-Path $metadataRoot 'metadata.json'
          $tokenPath = Join-Path $tokenRoot 'github-oidc.jwt'
          $oidcToken = $null
          $claims = $null
          $jti = $null
          $assertionDigest = $null
          $oidcRequestUrl = $null
          $oidcRequestBearer = $null
          $clientId = $null
          $tenantId = $null
          $ambientFederatedTokenPath = $null
          $ownerId = $null
          $repositoryId = $null
          $seenAssertionDigests = [Collections.Generic.HashSet[string]]::new(
            [StringComparer]::Ordinal
          )
          $seenJtis = [Collections.Generic.HashSet[string]]::new(
            [StringComparer]::Ordinal
          )
          try {
            foreach ($path in @($metadataRoot, $tokenRoot, $dotnetHome)) {
              if (Test-Path -LiteralPath $path) {
                throw 'A ceremony-local reusable signer scratch path already exists.'
              }
              [void](New-Item -ItemType Directory -Path $path)
            }

            Assert-ExactSigningIdentityEnvironment -AllowedAzureNames @(
              'AZURE_CONFIG_DIR', 'AZURE_EXTENSION_DIR', 'AZURE_DEVOPS_CACHE_DIR',
              'AZURE_CLIENT_ID', 'AZURE_TENANT_ID', 'AZURE_FEDERATED_TOKEN_FILE'
            ) -AllowedOidcNames @(
              'ACTIONS_ID_TOKEN_REQUEST_URL', 'ACTIONS_ID_TOKEN_REQUEST_TOKEN'
            )
            $oidcRequestUrl = $env:ACTIONS_ID_TOKEN_REQUEST_URL
            $oidcRequestBearer = $env:ACTIONS_ID_TOKEN_REQUEST_TOKEN
            $clientId = $env:SIGNING_AZURE_CLIENT_ID
            $tenantId = $env:SIGNING_AZURE_TENANT_ID
            $ambientFederatedTokenPath = [Environment]::GetEnvironmentVariable(
              'AZURE_FEDERATED_TOKEN_FILE', 'Process'
            )
            $ownerId = $env:SIGNING_GITHUB_OWNER_ID
            $repositoryId = $env:SIGNING_GITHUB_REPOSITORY_ID
            $artifactEndpoint = $env:ARTIFACT_SIGNING_ENDPOINT
            $artifactAccount = $env:ARTIFACT_SIGNING_ACCOUNT_NAME
            $artifactProfile = $env:ARTIFACT_SIGNING_CERTIFICATE_PROFILE_NAME
            if (-not [string]::IsNullOrWhiteSpace($ambientFederatedTokenPath)) {
              Remove-BoundedAmbientFederatedTokenFile `
                -RunnerTemp $runnerTemp -Path $ambientFederatedTokenPath
            }
            Clear-SigningIdentityEnvironment
            $ambientFederatedTokenPath = $null
            Assert-ExactSigningIdentityEnvironment -AllowedAzureNames @() -AllowedOidcNames @()

            if ($env:ARTIFACT_CONTRACT -ceq 'native') {
              $expectedRepository = 'Ikex-Creator/Msp'
              $expectedRef = 'refs/heads/main'
              $expectedWorkflowRef = 'Ikex-Creator/Msp/.github/workflows/windows-native-release.yml@refs/heads/main'
            } elseif ($env:ARTIFACT_CONTRACT -ceq 'rustdesk') {
              $expectedRepository = 'Ikex-Creator/rustdesk-client'
              $expectedRef = 'refs/heads/release/sit-rustdesk-1.4.9'
              $expectedWorkflowRef = 'Ikex-Creator/rustdesk-client/.github/workflows/sit-managed-release.yml@refs/heads/release/sit-rustdesk-1.4.9'
            } else {
              throw 'The reusable signer artifact contract is not exact.'
            }
            if ($env:GITHUB_REPOSITORY -cne $expectedRepository -or
                $env:GITHUB_REF -cne $expectedRef -or
                $env:GITHUB_REF_PROTECTED -cne 'true' -or
                $env:GITHUB_EVENT_NAME -cne 'workflow_dispatch' -or
                $env:GITHUB_WORKFLOW_REF -cne $expectedWorkflowRef -or
                $env:GITHUB_WORKFLOW_SHA -cne $env:GITHUB_SHA -or
                $env:GITHUB_SHA -cnotmatch '^[0-9a-f]{40}$' -or
                $env:SIGNING_SOURCE_COMMIT -cne $env:GITHUB_SHA -or
                $env:SIGNING_GENERATION -cnotmatch '^[0-9a-f]{32}$') {
              throw 'The reusable signer lost exact protected-main identity.'
            }
            $clientGuid = [Guid]::Empty
            $tenantGuid = [Guid]::Empty
            if (-not [Guid]::TryParseExact($clientId, 'D', [ref]$clientGuid) -or
                -not [Guid]::TryParseExact($tenantId, 'D', [ref]$tenantGuid) -or
                $clientId -cne $clientGuid.ToString('D') -or
                $tenantId -cne $tenantGuid.ToString('D')) {
              throw 'The protected workload-identity client or tenant ID is not canonical.'
            }
            foreach ($identityId in @($ownerId, $repositoryId)) {
              [UInt64]$parsedIdentityId = 0
              if ([string]::IsNullOrWhiteSpace($identityId) -or
                  $identityId -cnotmatch '^[1-9][0-9]{0,19}$' -or
                  -not [UInt64]::TryParse($identityId, [ref]$parsedIdentityId) -or
                  $parsedIdentityId -eq 0 -or
                  $identityId -cne $parsedIdentityId.ToString(
                    [Globalization.CultureInfo]::InvariantCulture
                  )) {
                throw 'The protected immutable GitHub owner or repository ID is not canonical.'
              }
            }
            $serviceEndpoint = $null
            if ([string]::IsNullOrWhiteSpace($artifactEndpoint) -or
                $artifactEndpoint -cne $artifactEndpoint.Trim() -or
                $artifactEndpoint.Length -gt 512 -or
                -not [Uri]::TryCreate(
                  $artifactEndpoint, [UriKind]::Absolute, [ref]$serviceEndpoint
                ) -or
                $serviceEndpoint.Scheme -cne 'https' -or
                $serviceEndpoint.UserInfo -or
                -not $serviceEndpoint.IsDefaultPort -or
                $serviceEndpoint.AbsolutePath -cne '/' -or
                $serviceEndpoint.Query -or $serviceEndpoint.Fragment -or
                $serviceEndpoint.DnsSafeHost -cnotmatch
                  '^[a-z0-9-]+\.(?:codesigning|artifactsigning)\.azure\.net$') {
              throw 'The protected Artifact Signing endpoint is not canonical.'
            }
            foreach ($value in @($artifactAccount, $artifactProfile)) {
              if ([string]::IsNullOrWhiteSpace($value) -or
                  $value -cne $value.Trim() -or $value.Length -gt 128 -or
                  $value -cnotmatch
                    '^[A-Za-z0-9](?:[A-Za-z0-9._-]{0,126}[A-Za-z0-9])?$') {
                throw 'The protected Artifact Signing account/profile name is not canonical.'
              }
            }

            $expectedHashes = [ordered]@{}
            $nativeHashInputs = @(
              $env:EXPECTED_ENDPOINT_EXE_SHA256,
              $env:EXPECTED_LAUNCHER_EXE_SHA256,
              $env:EXPECTED_ENDPOINT_MSI_SHA256,
              $env:EXPECTED_SETUP_EXE_SHA256,
              $env:EXPECTED_LAUNCHER_MSI_SHA256
            )
            if ($env:ARTIFACT_CONTRACT -ceq 'native' -and $env:SIGNING_PHASE -ceq 'phase-one') {
              if ($env:EXPECTED_ENDPOINT_EXE_SHA256 -cnotmatch '^[0-9a-f]{64}$' -or
                  $env:EXPECTED_LAUNCHER_EXE_SHA256 -cnotmatch '^[0-9a-f]{64}$' -or
                  $env:EXPECTED_ENDPOINT_MSI_SHA256 -cne '' -or
                  $env:EXPECTED_SETUP_EXE_SHA256 -cne '' -or
                  $env:EXPECTED_LAUNCHER_MSI_SHA256 -cne '') {
                throw 'The phase-one reusable signer hash contract is not exact.'
              }
              $expectedHashes['SymplifiedIT-EndpointAgent-x64.exe'] =
                $env:EXPECTED_ENDPOINT_EXE_SHA256
              $expectedHashes['SymplifiedIT-TechnicianLauncher-x64.exe'] =
                $env:EXPECTED_LAUNCHER_EXE_SHA256
            } elseif ($env:ARTIFACT_CONTRACT -ceq 'native' -and $env:SIGNING_PHASE -ceq 'phase-two') {
              if ($env:EXPECTED_ENDPOINT_EXE_SHA256 -cne '' -or
                  $env:EXPECTED_LAUNCHER_EXE_SHA256 -cne '' -or
                  $env:EXPECTED_ENDPOINT_MSI_SHA256 -cnotmatch '^[0-9a-f]{64}$' -or
                  $env:EXPECTED_SETUP_EXE_SHA256 -cnotmatch '^[0-9a-f]{64}$' -or
                  $env:EXPECTED_LAUNCHER_MSI_SHA256 -cnotmatch '^[0-9a-f]{64}$') {
                throw 'The phase-two reusable signer hash contract is not exact.'
              }
              $expectedHashes['SymplifiedIT-EndpointAgent-x64.msi'] =
                $env:EXPECTED_ENDPOINT_MSI_SHA256
              $expectedHashes['SymplifiedIT-Setup.exe'] =
                $env:EXPECTED_SETUP_EXE_SHA256
              $expectedHashes['SymplifiedIT-TechnicianLauncher-x64.msi'] =
                $env:EXPECTED_LAUNCHER_MSI_SHA256
            } elseif ($env:ARTIFACT_CONTRACT -ceq 'rustdesk' -and $env:SIGNING_PHASE -ceq 'phase-one') {
              if ($env:EXPECTED_RUSTDESK_EXE_SHA256 -cnotmatch '^[0-9a-f]{64}$' -or
                  $env:EXPECTED_RUSTDESK_MSI_SHA256 -cne '' -or
                  @($nativeHashInputs | Where-Object { $_ -cne '' }).Count -ne 0) {
                throw 'The RustDesk phase-one reusable signer hash contract is not exact.'
              }
              $expectedHashes['rustdesk-client.exe'] = $env:EXPECTED_RUSTDESK_EXE_SHA256
            } elseif ($env:ARTIFACT_CONTRACT -ceq 'rustdesk' -and $env:SIGNING_PHASE -ceq 'phase-two') {
              if ($env:EXPECTED_RUSTDESK_EXE_SHA256 -cne '' -or
                  $env:EXPECTED_RUSTDESK_MSI_SHA256 -cnotmatch '^[0-9a-f]{64}$' -or
                  @($nativeHashInputs | Where-Object { $_ -cne '' }).Count -ne 0) {
                throw 'The RustDesk phase-two reusable signer hash contract is not exact.'
              }
              $expectedHashes['rustdesk-client.msi'] = $env:EXPECTED_RUSTDESK_MSI_SHA256
            } else {
              throw 'The reusable signer phase is not exact.'
            }

            Assert-ExactCandidateInventory -Root $candidateRoot -ExpectedHashes $expectedHashes
            foreach ($name in $expectedHashes.Keys) {
              Assert-UnsignedCandidate -Path (Join-Path $candidateRoot $name) -ExpectedSHA256 $expectedHashes[$name]
            }
            Assert-OfflineSigningTools -Root $toolsRoot
            $expectedVcFingerprint = Get-VCRuntimeFingerprint
            if ($expectedVcFingerprint -cnotmatch '^[0-9a-f]{64}$') {
              throw 'The Artifact Signing VC++ prerequisite fingerprint is malformed.'
            }

            $metadata = [ordered]@{
              Endpoint = $artifactEndpoint
              CodeSigningAccountName = $artifactAccount
              CertificateProfileName = $artifactProfile
              # WorkloadIdentityCredential is the sole non-excluded credential path.
              ExcludeCredentials = @(
                'EnvironmentCredential',
                'ManagedIdentityCredential',
                'SharedTokenCacheCredential',
                'VisualStudioCredential',
                'VisualStudioCodeCredential',
                'AzureCliCredential',
                'AzurePowerShellCredential',
                'AzureDeveloperCliCredential',
                'InteractiveBrowserCredential'
              )
            }
            [IO.File]::WriteAllText(
              $metadataPath,
              ($metadata | ConvertTo-Json -Depth 4 -Compress) + [char]10,
              (New-Object Text.UTF8Encoding($false))
            )
            $expectedMetadataSHA256 = (
              Get-FileHash -LiteralPath $metadataPath -Algorithm SHA256
            ).Hash.ToLowerInvariant()
            $signTool = Join-Path $toolsRoot (
              'buildtools\bin\10.0.26100.0\x64\signtool.exe'
            )
            $dlib = Join-Path $toolsRoot 'client\bin\x64\Azure.CodeSigning.Dlib.dll'
            $dotnetRoot = Join-Path $toolsRoot 'dotnet'
            $systemRoot = [IO.Path]::GetFullPath($env:SystemRoot).TrimEnd(
              [IO.Path]::DirectorySeparatorChar
            )
            if (-not [Environment]::Is64BitProcess -or
                -not [IO.Path]::GetFullPath([Environment]::SystemDirectory).Equals(
                  (Join-Path $systemRoot 'System32'),
                  [StringComparison]::OrdinalIgnoreCase
                )) {
              throw 'The Artifact Signing child Windows root is not canonical.'
            }
            Assert-PrivateSigningScratch -MetadataRoot $metadataRoot -TokenRoot $tokenRoot -DotNetHome $dotnetHome -ExpectedMetadataSHA256 $expectedMetadataSHA256 -RequireToken $false

            foreach ($name in $expectedHashes.Keys) {
              $candidate = Join-Path $candidateRoot $name
              $expectedHash = [string]$expectedHashes[$name]
              Assert-ExactCandidateInventory -Root $candidateRoot -ExpectedHashes $expectedHashes
              Assert-UnsignedCandidate -Path $candidate -ExpectedSHA256 $expectedHash
              $vcFingerprint = Get-VCRuntimeFingerprint
              if ($vcFingerprint -cne $expectedVcFingerprint) {
                throw 'The Artifact Signing VC++ prerequisite changed before one signature.'
              }
              Assert-ExactSigningIdentityEnvironment -AllowedAzureNames @() -AllowedOidcNames @()
              try {
                $oidcToken = Get-BoundedGitHubOidcToken -Audience 'api://AzureADTokenExchange' -RequestUrlText $oidcRequestUrl -RequestBearer $oidcRequestBearer
                $claims = ConvertFrom-BoundedOidcPayload -Token $oidcToken
                $jti = Assert-BoundedGitHubOidcClaims -Claims $claims -OwnerId $ownerId -RepositoryId $repositoryId -SourceCommit $env:SIGNING_SOURCE_COMMIT -ArtifactContract $env:ARTIFACT_CONTRACT
                $assertionBytes = $null
                $assertionHasher = $null
                try {
                  $assertionBytes = (New-Object Text.UTF8Encoding($false, $true)).GetBytes(
                    $oidcToken
                  )
                  $assertionHasher = [Security.Cryptography.SHA256]::Create()
                  $assertionDigest = [BitConverter]::ToString(
                    $assertionHasher.ComputeHash($assertionBytes)
                  ).Replace('-', '').ToLowerInvariant()
                } finally {
                  if ($null -ne $assertionHasher) { $assertionHasher.Dispose() }
                  if ($null -ne $assertionBytes) {
                    [Array]::Clear($assertionBytes, 0, $assertionBytes.Length)
                  }
                  $assertionHasher = $null
                  $assertionBytes = $null
                }
                if (-not $seenAssertionDigests.Add($assertionDigest) -or
                    -not $seenJtis.Add($jti)) {
                  throw 'GitHub returned a duplicate assertion or jti in one signing phase.'
                }
                [IO.File]::WriteAllText(
                  $tokenPath, $oidcToken, (New-Object Text.UTF8Encoding($false, $true))
                )
                Assert-PrivateSigningScratch -MetadataRoot $metadataRoot -TokenRoot $tokenRoot -DotNetHome $dotnetHome -ExpectedMetadataSHA256 $expectedMetadataSHA256 -RequireToken $true
                Assert-UnsignedCandidate -Path $candidate -ExpectedSHA256 $expectedHash
                Invoke-BoundedArtifactSign -SignToolPath $signTool -DlibPath $dlib -MetadataPath $metadataPath -CandidatePath $candidate -ScratchRoot $metadataRoot -DotNetRoot $dotnetRoot -DotNetHome $dotnetHome -SystemRoot $systemRoot -ClientId $clientId -TenantId $tenantId -FederatedTokenPath $tokenPath -ToolRoot $toolsRoot -ExpectedMetadataSHA256 $expectedMetadataSHA256 -ExpectedCandidateSHA256 $expectedHash -ExpectedAssertionSHA256 $assertionDigest
              } finally {
                if (Test-Path -LiteralPath $tokenPath) {
                  $tokenItem = Get-Item -LiteralPath $tokenPath -Force
                  if ($tokenItem.PSIsContainer -or
                      ($tokenItem.Attributes -band [IO.FileAttributes]::ReparsePoint) -ne 0) {
                    throw 'The one-use GitHub assertion path became unsafe.'
                  }
                  Remove-Item -LiteralPath $tokenPath -Force
                }
                $oidcToken = $null
                $claims = $null
                $jti = $null
                $assertionDigest = $null
              }
              Assert-ExactSigningIdentityEnvironment -AllowedAzureNames @() -AllowedOidcNames @()
              Assert-SignedCandidate -Path $candidate -UnsignedSHA256 $expectedHash
              Assert-OfflineSigningTools -Root $toolsRoot
              Assert-PrivateSigningScratch -MetadataRoot $metadataRoot -TokenRoot $tokenRoot -DotNetHome $dotnetHome -ExpectedMetadataSHA256 $expectedMetadataSHA256 -RequireToken $false
            }
            Assert-ExactCandidateInventory -Root $candidateRoot -ExpectedHashes $expectedHashes
            foreach ($name in $expectedHashes.Keys) {
              Assert-SignedCandidate -Path (Join-Path $candidateRoot $name) -UnsignedSHA256 $expectedHashes[$name]
            }
          } finally {
            Clear-SigningIdentityEnvironment
            $oidcToken = $null
            $claims = $null
            $jti = $null
            $assertionDigest = $null
            $oidcRequestBearer = $null
            $oidcRequestUrl = $null
            $clientId = $null
            $tenantId = $null
            $ambientFederatedTokenPath = $null
            $ownerId = $null
            $repositoryId = $null
            if ($null -ne $seenAssertionDigests) { $seenAssertionDigests.Clear() }
            if ($null -ne $seenJtis) { $seenJtis.Clear() }
            Remove-ExactScratchRoot -RunnerTemp $runnerTemp -Path $tokenRoot -ExpectedLeaf 'symplifiedit-workload-identity'
            Remove-ExactScratchRoot -RunnerTemp $runnerTemp -Path $metadataRoot -ExpectedLeaf 'symplifiedit-artifact-signing-metadata'
            Remove-ExactScratchRoot -RunnerTemp $runnerTemp -Path $dotnetHome -ExpectedLeaf 'symplifiedit-dotnet-home'
          }

          '@
          [IO.File]::AppendAllText(
            $scriptPath,
            $fragment + [Environment]::NewLine,
            [Text.UTF8Encoding]::new($false)
          )

      - name: Sign exact phase with fresh bounded workload assertions
        shell: pwsh
        env:
          ARTIFACT_CONTRACT: ${{ inputs.artifact_contract }}
          SIGNING_PHASE: ${{ inputs.phase }}
          SIGNING_GENERATION: ${{ inputs.generation }}
          SIGNING_SOURCE_COMMIT: ${{ inputs.source_commit }}
          EXPECTED_ENDPOINT_EXE_SHA256: ${{ inputs.endpoint_exe_sha256 }}
          EXPECTED_LAUNCHER_EXE_SHA256: ${{ inputs.launcher_exe_sha256 }}
          EXPECTED_ENDPOINT_MSI_SHA256: ${{ inputs.endpoint_msi_sha256 }}
          EXPECTED_SETUP_EXE_SHA256: ${{ inputs.setup_exe_sha256 }}
          EXPECTED_LAUNCHER_MSI_SHA256: ${{ inputs.launcher_msi_sha256 }}
          EXPECTED_RUSTDESK_EXE_SHA256: ${{ inputs.rustdesk_exe_sha256 }}
          EXPECTED_RUSTDESK_MSI_SHA256: ${{ inputs.rustdesk_msi_sha256 }}
          SIGNING_AZURE_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
          SIGNING_AZURE_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
          SIGNING_GITHUB_OWNER_ID: ${{ vars.ARTIFACT_SIGNING_GITHUB_OWNER_ID }}
          SIGNING_GITHUB_REPOSITORY_ID: ${{ vars.ARTIFACT_SIGNING_GITHUB_REPOSITORY_ID }}
          ARTIFACT_SIGNING_ENDPOINT: ${{ vars.AZURE_ARTIFACT_SIGNING_ENDPOINT }}
          ARTIFACT_SIGNING_ACCOUNT_NAME: ${{ vars.AZURE_ARTIFACT_SIGNING_ACCOUNT_NAME }}
          ARTIFACT_SIGNING_CERTIFICATE_PROFILE_NAME: ${{ vars.AZURE_ARTIFACT_SIGNING_CERTIFICATE_PROFILE_NAME }}
        run: |
          $ErrorActionPreference = 'Stop'
          Set-StrictMode -Version 3.0
          $scriptPath = Join-Path $env:RUNNER_TEMP 'symplifiedit-artifact-signer.ps1'
          $item = Get-Item -LiteralPath $scriptPath -Force -ErrorAction Stop
          if ($item.PSIsContainer -or $item.Length -lt 40000 -or $item.Length -gt 70000 -or
              ($item.Attributes -band [IO.FileAttributes]::ReparsePoint) -ne 0) {
            throw 'The staged private signer program is unsafe or incomplete.'
          }
          try {
            & $scriptPath
          } finally {
            Remove-Item -LiteralPath $scriptPath -Force -ErrorAction SilentlyContinue
          }

      - name: Clear reusable signer identity and private scratch
        if: ${{ always() }}
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Set-StrictMode -Version 3.0

          foreach ($name in @(
            'SIGNING_AZURE_CLIENT_ID', 'SIGNING_AZURE_TENANT_ID',
            'SIGNING_GITHUB_OWNER_ID', 'SIGNING_GITHUB_REPOSITORY_ID',
            'ARTIFACT_SIGNING_ENDPOINT', 'ARTIFACT_SIGNING_ACCOUNT_NAME',
            'ARTIFACT_SIGNING_CERTIFICATE_PROFILE_NAME',
            'AZURE_CONFIG_DIR', 'AZURE_EXTENSION_DIR', 'AZURE_DEVOPS_CACHE_DIR',
            'AZURE_CLIENT_ID', 'AZURE_TENANT_ID', 'AZURE_FEDERATED_TOKEN_FILE',
            'AZURE_CLIENT_SECRET', 'AZURE_CLIENT_CERTIFICATE_PATH',
            'AZURE_CLIENT_CERTIFICATE_PASSWORD', 'AZURE_USERNAME', 'AZURE_PASSWORD',
            'ARM_CLIENT_ID', 'ARM_TENANT_ID', 'ARM_CLIENT_SECRET',
            'ARM_CLIENT_CERTIFICATE_PATH', 'ARM_CLIENT_CERTIFICATE_PASSWORD',
            'ARM_USERNAME', 'ARM_PASSWORD',
            'ACTIONS_ID_TOKEN_REQUEST_URL', 'ACTIONS_ID_TOKEN_REQUEST_TOKEN'
          )) {
            [Environment]::SetEnvironmentVariable($name, $null, 'Process')
          }
          $runnerTemp = [IO.Path]::GetFullPath($env:RUNNER_TEMP).TrimEnd('\', '/')
          foreach ($leaf in @(
            'symplifiedit-workload-identity',
            'symplifiedit-artifact-signing-metadata',
            'symplifiedit-dotnet-home'
          )) {
            $path = Join-Path $runnerTemp $leaf
            $fullPath = [IO.Path]::GetFullPath($path).TrimEnd('\', '/')
            if ([IO.Path]::GetDirectoryName($fullPath) -cne $runnerTemp -or
                [IO.Path]::GetFileName($fullPath) -cne $leaf) {
              throw 'The reusable signer cleanup target is not exact.'
            }
            if (Test-Path -LiteralPath $fullPath) {
              $item = Get-Item -LiteralPath $fullPath -Force
              if (-not $item.PSIsContainer -or
                  ($item.Attributes -band [IO.FileAttributes]::ReparsePoint) -ne 0 -or
                  @(Get-ChildItem -LiteralPath $fullPath -Recurse -Force | Where-Object {
                    ($_.Attributes -band [IO.FileAttributes]::ReparsePoint) -ne 0
                  }).Count -ne 0) {
                throw 'A reusable signer cleanup root is unsafe.'
              }
              Remove-Item -LiteralPath $fullPath -Recurse -Force
            }
            if (Test-Path -LiteralPath $fullPath) {
              throw 'A reusable signer private path survived cleanup.'
            }
          }

      - name: Upload exact signed candidate handoff
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: signed-${{ inputs.phase }}-${{ inputs.generation }}-${{ inputs.source_commit }}
          path: ${{ runner.temp }}\symplifiedit-signing-candidates\
          if-no-files-found: error
          retention-days: 2
          compression-level: 0
          include-hidden-files: false
