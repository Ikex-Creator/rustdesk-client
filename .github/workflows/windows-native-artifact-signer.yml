              [Parameter(Mandatory = $true)][string]$ToolRoot,
              [Parameter(Mandatory = $true)][string]$ExpectedMetadataSHA256,
              [Parameter(Mandatory = $true)][string]$ExpectedCandidateSHA256,
              [Parameter(Mandatory = $true)][string]$ExpectedAssertionSHA256
            )

            $system32 = Join-Path $SystemRoot 'System32'
            $expectedSignToolPath = Join-Path $ToolRoot (
              'buildtools\bin\10.0.26100.0\x64\signtool.exe'
            )
            $expectedDlibPath = Join-Path $ToolRoot (
              'client\bin\x64\Azure.CodeSigning.Dlib.dll'
            )
            $expectedDotNetRoot = Join-Path $ToolRoot 'dotnet'
            if (-not [IO.Path]::GetFullPath($SignToolPath).Equals(
                  [IO.Path]::GetFullPath($expectedSignToolPath),
                  [StringComparison]::OrdinalIgnoreCase
                ) -or
                -not [IO.Path]::GetFullPath($DlibPath).Equals(
                  [IO.Path]::GetFullPath($expectedDlibPath),
                  [StringComparison]::OrdinalIgnoreCase
                ) -or
                -not [IO.Path]::GetFullPath($DotNetRoot).Equals(
                  [IO.Path]::GetFullPath($expectedDotNetRoot),
                  [StringComparison]::OrdinalIgnoreCase
                )) {
              throw 'A privileged signing process path is not rooted in the attested tree.'
            }
            $childEnvironment = [ordered]@{
              'SystemRoot' = $SystemRoot
              'WINDIR' = $SystemRoot
              'TEMP' = $DotNetHome
              'TMP' = $DotNetHome
              'PATH' = "$DotNetRoot;$system32;$SystemRoot"
              'DOTNET_ROOT' = $DotNetRoot
              'DOTNET_ROOT_X64' = $DotNetRoot
              'DOTNET_MULTILEVEL_LOOKUP' = '0'
              'DOTNET_ROLL_FORWARD' = 'LatestPatch'
              'DOTNET_ROLL_FORWARD_TO_PRERELEASE' = '0'
              'DOTNET_CLI_HOME' = $DotNetHome
              'DOTNET_CLI_TELEMETRY_OPTOUT' = '1'
              'DOTNET_NOLOGO' = '1'
              'DOTNET_SKIP_FIRST_TIME_EXPERIENCE' = '1'
              'AZURE_CLIENT_ID' = $ClientId
              'AZURE_TENANT_ID' = $TenantId
              'AZURE_FEDERATED_TOKEN_FILE' = $FederatedTokenPath
            }
            if ($childEnvironment.Count -ne 17 -or
                -not (Test-Path -LiteralPath $system32 -PathType Container) -or
                @($childEnvironment.Values | Where-Object {
                  [string]::IsNullOrWhiteSpace([string]$_) -or [string]$_ -match '[\r\n]'
                }).Count -ne 0) {
