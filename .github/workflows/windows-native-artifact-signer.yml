              if ($null -ne $request) { $request.Dispose() }
              if ($null -ne $client) { $client.Dispose() }
              if ($null -ne $handler) { $handler.Dispose() }
              $readCancellation = $null
              $responseStream = $null
              $responseBytes = $null
            }
          }

