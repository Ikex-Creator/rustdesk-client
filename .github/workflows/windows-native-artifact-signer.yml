            }

            $process = [Diagnostics.Process]::new()
            $process.StartInfo = $startInfo
            $stdoutBuffer = [char[]]::new(4096)
            $stderrBuffer = [char[]]::new(4096)
            $stdoutRead = $null
            $stderrRead = $null
            $outputCharacters = [long]0
            try {
              if (-not $process.Start()) {
                throw 'start failed'
              }
              $stdoutRead = $process.StandardOutput.ReadAsync(
                $stdoutBuffer, 0, $stdoutBuffer.Length
              )
              $stderrRead = $process.StandardError.ReadAsync(
                $stderrBuffer, 0, $stderrBuffer.Length
              )
              $stopwatch = [Diagnostics.Stopwatch]::StartNew()
              while ($true) {
                foreach ($stream in @('stdout', 'stderr')) {
                  $readTask = if ($stream -ceq 'stdout') { $stdoutRead } else { $stderrRead }
                  $buffer = if ($stream -ceq 'stdout') { $stdoutBuffer } else { $stderrBuffer }
                  if ($null -eq $readTask -or -not $readTask.IsCompleted) { continue }
                  $count = $readTask.GetAwaiter().GetResult()
                  if ($count -eq 0) {
                    if ($stream -ceq 'stdout') {
                      $stdoutRead = $null
                    } else {
                      $stderrRead = $null
                    }
                  } else {
                    $outputCharacters += $count
                    [Array]::Clear($buffer, 0, $buffer.Length)
                    if ($outputCharacters -gt 65536) {
                      try { $process.Kill($true) } catch { }
                      throw 'bounded output exceeded'
                    }
                    if ($stream -ceq 'stdout') {
                      $stdoutRead = $process.StandardOutput.ReadAsync(
                        $stdoutBuffer, 0, $stdoutBuffer.Length
                      )
                    } else {
                      $stderrRead = $process.StandardError.ReadAsync(
                        $stderrBuffer, 0, $stderrBuffer.Length
                      )
                    }
                  }
                }
                if ($process.HasExited -and
                    $null -eq $stdoutRead -and $null -eq $stderrRead) {
                  break
                }
                if ($stopwatch.Elapsed -gt [TimeSpan]::FromMinutes(5)) {
                  try { $process.Kill($true) } catch { }
                  throw 'timeout'
                }
                [Threading.Thread]::Sleep(25)
              }
              $process.WaitForExit()
              if ($process.ExitCode -ne 0) {
                throw 'nonzero exit'
              }
            } catch {
              throw 'Pinned Microsoft Artifact Signing failed; bounded privileged output was suppressed.'
            } finally {
              [Array]::Clear($stdoutBuffer, 0, $stdoutBuffer.Length)
              [Array]::Clear($stderrBuffer, 0, $stderrBuffer.Length)
              $stdoutRead = $null
              $stderrRead = $null
              $process.Dispose()
            }
          }

          function Remove-BoundedAmbientFederatedTokenFile {
            param(
              [Parameter(Mandatory = $true)][string]$RunnerTemp,
              [Parameter(Mandatory = $true)][string]$Path
            )

            if ($Path -cne $Path.Trim() -or $Path.Length -gt 32767 -or
                $Path -match '[\r\n]') {
