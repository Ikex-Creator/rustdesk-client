              [void]$startInfo.ArgumentList.Add($argument)
            }
            Assert-OfflineSigningTools -Root $ToolRoot
            if ($ExpectedMetadataSHA256 -cnotmatch '^[0-9a-f]{64}$' -or
                $ExpectedCandidateSHA256 -cnotmatch '^[0-9a-f]{64}$' -or
                $ExpectedAssertionSHA256 -cnotmatch '^[0-9a-f]{64}$' -or
                (Get-FileHash -LiteralPath $MetadataPath -Algorithm SHA256).Hash.ToLowerInvariant() -cne
                  $ExpectedMetadataSHA256 -or
                (Get-FileHash -LiteralPath $CandidatePath -Algorithm SHA256).Hash.ToLowerInvariant() -cne
                  $ExpectedCandidateSHA256 -or
                (Get-FileHash -LiteralPath $FederatedTokenPath -Algorithm SHA256).Hash.ToLowerInvariant() -cne
                  $ExpectedAssertionSHA256) {
