name: Windows native Artifact Signing reusable boundary

on:
  workflow_call:
    inputs:
      artifact_contract:
        description: Exact candidate contract, native or rustdesk.
        required: false
        default: native
        type: string
      phase:
        description: Exact signing phase, phase-one or phase-two.
        required: true
        type: string
      generation:
        description: Exact lower-case 128-bit release generation.
        required: true
        type: string
      source_commit:
        description: Exact lower-case main commit built by the caller.
        required: true
        type: string
      endpoint_exe_sha256:
        description: Phase-one endpoint EXE unsigned SHA-256; empty in phase two.
        required: true
        type: string
      launcher_exe_sha256:
        description: Phase-one launcher EXE unsigned SHA-256; empty in phase two.
        required: true
        type: string
      endpoint_msi_sha256:
        description: Phase-two endpoint MSI unsigned SHA-256; empty in phase one.
        required: true
        type: string
      setup_exe_sha256:
        description: Phase-two Setup EXE unsigned SHA-256; empty in phase one.
        required: true
        type: string
      launcher_msi_sha256:
        description: Phase-two launcher MSI unsigned SHA-256; empty in phase one.
        required: true
        type: string
      rustdesk_exe_sha256:
        description: RustDesk phase-one EXE unsigned SHA-256; empty otherwise.
        required: false
        default: ''
        type: string
      rustdesk_msi_sha256:
        description: RustDesk phase-two MSI unsigned SHA-256; empty otherwise.
        required: false
        default: ''
        type: string

permissions: {}

concurrency:
  group: windows-native-artifact-signing
  cancel-in-progress: false

jobs:
  sign:
    name: Sign exact native candidate phase
    if: >-
      ((inputs.artifact_contract == 'native' &&
        github.repository == 'Ikex-Creator/Msp' &&
        github.ref == 'refs/heads/main' &&
        github.workflow_ref == 'Ikex-Creator/Msp/.github/workflows/windows-native-release.yml@refs/heads/main') ||
       (inputs.artifact_contract == 'rustdesk' &&
        github.repository == 'Ikex-Creator/rustdesk-client' &&
        github.ref == 'refs/heads/release/sit-rustdesk-1.4.9' &&
        github.workflow_ref == 'Ikex-Creator/rustdesk-client/.github/workflows/sit-managed-release.yml@refs/heads/release/sit-rustdesk-1.4.9')) &&
      github.ref_protected == true &&
      github.event_name == 'workflow_dispatch' &&
      github.workflow_sha == github.sha
    runs-on: windows-2025
    timeout-minutes: 25
    environment: windows-artifact-signing
    permissions:
      contents: none
      id-token: write

    steps:
      - name: Validate exact reusable signer request
        shell: pwsh
        env:
          ARTIFACT_CONTRACT: ${{ inputs.artifact_contract }}
          SIGNING_PHASE: ${{ inputs.phase }}
          SIGNING_GENERATION: ${{ inputs.generation }}
          SIGNING_SOURCE_COMMIT: ${{ inputs.source_commit }}
          ENDPOINT_EXE_SHA256: ${{ inputs.endpoint_exe_sha256 }}
          LAUNCHER_EXE_SHA256: ${{ inputs.launcher_exe_sha256 }}
          ENDPOINT_MSI_SHA256: ${{ inputs.endpoint_msi_sha256 }}
          SETUP_EXE_SHA256: ${{ inputs.setup_exe_sha256 }}
          LAUNCHER_MSI_SHA256: ${{ inputs.launcher_msi_sha256 }}
          RUSTDESK_EXE_SHA256: ${{ inputs.rustdesk_exe_sha256 }}
          RUSTDESK_MSI_SHA256: ${{ inputs.rustdesk_msi_sha256 }}
        run: |
          $ErrorActionPreference = 'Stop'
          Set-StrictMode -Version 3.0

          if ($env:ARTIFACT_CONTRACT -ceq 'native') {
            $expectedRepository = 'Ikex-Creator/Msp'
            $expectedRef = 'refs/heads/main'
            $expectedWorkflowRef = 'Ikex-Creator/Msp/.github/workflows/windows-native-release.yml@refs/heads/main'
          } elseif ($env:ARTIFACT_CONTRACT -ceq 'rustdesk') {
            $expectedRepository = 'Ikex-Creator/rustdesk-client'
            $expectedRef = 'refs/heads/release/sit-rustdesk-1.4.9'
            $expectedWorkflowRef = 'Ikex-Creator/rustdesk-client/.github/workflows/sit-managed-release.yml@refs/heads/release/sit-rustdesk-1.4.9'
          } else {
            throw 'The reusable signer artifact contract is not exact.'
          }
          if ($env:GITHUB_REPOSITORY -cne $expectedRepository -or
              $env:GITHUB_REF -cne $expectedRef -or
              $env:GITHUB_REF_PROTECTED -cne 'true' -or
              $env:GITHUB_EVENT_NAME -cne 'workflow_dispatch' -or
              $env:GITHUB_WORKFLOW_REF -cne $expectedWorkflowRef -or
              $env:GITHUB_WORKFLOW_SHA -cne $env:GITHUB_SHA -or
              $env:GITHUB_SHA -cnotmatch '^[0-9a-f]{40}$' -or
              $env:SIGNING_SOURCE_COMMIT -cne $env:GITHUB_SHA -or
              $env:SIGNING_GENERATION -cnotmatch '^[0-9a-f]{32}$') {
            throw 'The reusable signer request is not exact protected main.'
          }

          $phaseOneHashes = @(
            $env:ENDPOINT_EXE_SHA256,
            $env:LAUNCHER_EXE_SHA256
          )
          $phaseTwoHashes = @(
            $env:ENDPOINT_MSI_SHA256,
            $env:SETUP_EXE_SHA256,
            $env:LAUNCHER_MSI_SHA256
          )
          $rustDeskHashes = @($env:RUSTDESK_EXE_SHA256, $env:RUSTDESK_MSI_SHA256)
          if ($env:ARTIFACT_CONTRACT -ceq 'native' -and $env:SIGNING_PHASE -ceq 'phase-one') {
            $requiredHashes = $phaseOneHashes
            $forbiddenHashes = $phaseTwoHashes + $rustDeskHashes
          } elseif ($env:ARTIFACT_CONTRACT -ceq 'native' -and $env:SIGNING_PHASE -ceq 'phase-two') {
            $requiredHashes = $phaseTwoHashes
            $forbiddenHashes = $phaseOneHashes + $rustDeskHashes
          } elseif ($env:ARTIFACT_CONTRACT -ceq 'rustdesk' -and $env:SIGNING_PHASE -ceq 'phase-one') {
            $requiredHashes = @($env:RUSTDESK_EXE_SHA256)
            $forbiddenHashes = $phaseOneHashes + $phaseTwoHashes + @($env:RUSTDESK_MSI_SHA256)
          } elseif ($env:ARTIFACT_CONTRACT -ceq 'rustdesk' -and $env:SIGNING_PHASE -ceq 'phase-two') {
            $requiredHashes = @($env:RUSTDESK_MSI_SHA256)
            $forbiddenHashes = $phaseOneHashes + $phaseTwoHashes + @($env:RUSTDESK_EXE_SHA256)
          } else {
            throw 'The reusable signer phase is not exact.'
          }
          if (@($requiredHashes | Where-Object { $_ -cnotmatch '^[0-9a-f]{64}$' }).Count -ne 0 -or
              @($forbiddenHashes | Where-Object { $_ -cne '' }).Count -ne 0) {
            throw 'The reusable signer hash input contract is not exact.'
          }

      - name: Download exact unsigned candidate handoff
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: unsigned-${{ inputs.phase }}-${{ inputs.generation }}-${{ inputs.source_commit }}
          path: ${{ runner.temp }}\symplifiedit-signing-candidates

      - name: Download exact offline Microsoft signing tools
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: offline-signing-tools-${{ inputs.generation }}-${{ inputs.source_commit }}
          path: ${{ runner.temp }}\symplifiedit-offline-signing-tools

      - name: Stage exact signer program part 1 of 4
        shell: pwsh
        run: |
          $scriptPath = Join-Path $env:RUNNER_TEMP 'symplifiedit-artifact-signer.ps1'
          if (Test-Path -LiteralPath $scriptPath) {
            throw 'The private signer program path was not clean.'
          }
          $fragment = @'
          $ErrorActionPreference = 'Stop'
          Set-StrictMode -Version 3.0
          $DebugPreference = 'SilentlyContinue'
          $VerbosePreference = 'SilentlyContinue'
          $InformationPreference = 'SilentlyContinue'
          $ProgressPreference = 'SilentlyContinue'

          function Get-CanonicalToolTree {
            param([Parameter(Mandatory = $true)][string]$Root)

            $rootItem = Get-Item -LiteralPath $Root -Force -ErrorAction Stop
            if (-not $rootItem.PSIsContainer -or
                ($rootItem.Attributes -band [IO.FileAttributes]::ReparsePoint) -ne 0) {
              throw 'The privileged signing tool tree root is unsafe.'
            }
            $entries = @(Get-ChildItem -LiteralPath $rootItem.FullName -Recurse -Force)
            if (@($entries | Where-Object {
              ($_.Attributes -band [IO.FileAttributes]::ReparsePoint) -ne 0
            }).Count -ne 0) {
              throw 'The privileged signing tool tree contains a reparse point.'
            }
            $map = [Collections.Generic.Dictionary[string, object]]::new(
              [StringComparer]::Ordinal
            )
            foreach ($file in @($entries | Where-Object { -not $_.PSIsContainer })) {
              $relative = [IO.Path]::GetRelativePath($Root, $file.FullName).Replace('\', '/')
              if ([string]::IsNullOrWhiteSpace($relative) -or
                  $relative -match '[\x00-\x1f\x7f]' -or
                  $relative.Split('/') -contains '..' -or $map.ContainsKey($relative)) {
                throw 'The privileged signing tool tree contains an invalid path.'
              }
              $map.Add($relative, $file)
            }
            [string[]]$paths = @($map.Keys)
            [Array]::Sort($paths, [StringComparer]::Ordinal)
            $records = [Collections.Generic.List[string]]::new()
            $tab = [char]9
            foreach ($relative in $paths) {
              $file = $map[$relative]
              $hash = (Get-FileHash -LiteralPath $file.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
              $records.Add(
                $relative + $tab +
                $file.Length.ToString([Globalization.CultureInfo]::InvariantCulture) + $tab +
                $hash
              )
            }
            $bytes = (New-Object Text.UTF8Encoding($false)).GetBytes(
              ($records.ToArray() -join [char]10) + [char]10
            )
            $sha256 = [Security.Cryptography.SHA256]::Create()
            try {
              $treeHash = ([BitConverter]::ToString(
                $sha256.ComputeHash($bytes)
              )).Replace('-', '').ToLowerInvariant()
            } finally {
              $sha256.Dispose()
            }
            return [pscustomobject]@{
              FileCount = $paths.Count
              ManifestBytes = $bytes.Length
              SHA256 = $treeHash
            }
          }

          function Assert-OfflineSigningTools {
            param([Parameter(Mandatory = $true)][string]$Root)

            $rootEntries = @(Get-ChildItem -LiteralPath $Root -Force | Sort-Object Name)
            $expectedRoot = @('buildtools', 'client', 'dotnet') | Sort-Object
            if (($rootEntries.Name -join [char]10) -cne ($expectedRoot -join [char]10) -or
                @($rootEntries | Where-Object {
                  -not $_.PSIsContainer -or
                  ($_.Attributes -band [IO.FileAttributes]::ReparsePoint) -ne 0
                }).Count -ne 0) {
              throw 'The privileged offline signing-tool root inventory is not exact.'
            }
            foreach ($contract in @(
              @('buildtools', 192, 22225, 'b9e7b3af121852f804a3aa85dda281b02f9eae6383ff5da8ecdadf4fe6e24586'),
              @('client', 93, 9345, '709ef91e442f85a9992a7d75a772ea37c44057d47dbf7c8dc3390c0230224610'),
              @('dotnet', 188, 25438, 'c1f9e26ca15bb2617094caffc4937fd8e3cd25a12592bcfc1a570a086d668211'),
              @('buildtools\bin\10.0.26100.0\x64', 54, 5037, '9ae9771eae871c1f93c23170d7a45e7a6653fa72b1906199c1e80c0e972d3d20')
            )) {
              $tree = Get-CanonicalToolTree -Root (Join-Path $Root $contract[0])
              if ($tree.FileCount -ne $contract[1] -or
                  $tree.ManifestBytes -ne $contract[2] -or
                  $tree.SHA256 -cne $contract[3]) {
                throw 'The complete privileged offline signing-tool tree drifted.'
              }
            }
            foreach ($contract in @(
              @('buildtools\bin\10.0.26100.0\x64\signtool.exe', 542288, '0e2896a643540cad3b7078c796c2135911d224f3e76a8284b71673d621220921'),
              @('client\bin\x64\Azure.CodeSigning.Dlib.dll', 121376, '2d4c1bbc87467b3ac25bbc49df58cc8b36a0f92b3e21aa98bbbad08a4d7c98ba'),
              @('client\bin\x64\Azure.CodeSigning.Dlib.Core.dll', 34848, '1d94ffa09144d9d6d9789d135a772e62356fb89e946af72a6e7f7c7aaebc070c'),
              @('client\bin\x64\Azure.CodeSigning.Dlib.runtimeconfig.json', 416, 'c5c339dd6be63f3030b74251503f874cbf56ca1bce24280341aa3331a0345dee'),
              @('dotnet\dotnet.exe', 157480, '76e6472063f53379b86fe8370203ab6c46c75d27f405b722845f0e495d8f5fd0'),
              @('dotnet\host\fxr\8.0.30\hostfxr.dll', 366376, '751ccef66f160ca66ca9ac5bde2e781c360d9706f9aaba0a6f180557f80798c2'),
              @('dotnet\shared\Microsoft.NETCore.App\8.0.30\hostpolicy.dll', 406824, '1b629e243366c8db82a55d0d8b0562d924e6681e81afc100e79526053451971a')
            )) {
              $path = Join-Path $Root $contract[0]
              $item = Get-Item -LiteralPath $path -Force -ErrorAction Stop
              if ($item.PSIsContainer -or
                  ($item.Attributes -band [IO.FileAttributes]::ReparsePoint) -ne 0 -or
                  $item.Length -ne $contract[1] -or
                  (Get-FileHash -LiteralPath $path -Algorithm SHA256).Hash.ToLowerInvariant() -cne
                    $contract[2]) {
                throw 'A critical privileged signing file drifted.'
              }
            }
          }

          function Assert-ExactSigningIdentityEnvironment {
            param(
              [Parameter(Mandatory = $true)]
              [AllowEmptyCollection()]
              [string[]]$AllowedAzureNames,
              [Parameter(Mandatory = $true)]
              [AllowEmptyCollection()]
              [string[]]$AllowedOidcNames
            )

            $environment = [Environment]::GetEnvironmentVariables('Process')
            $keys = @($environment.Keys | ForEach-Object { [string]$_ })
            $expectedHostedAzureTools = [ordered]@{
              'AZURE_CONFIG_DIR' = 'C:\azureCli'
              'AZURE_EXTENSION_DIR' = 'C:\Program Files\Common Files\AzureCliExtensionDirectory'
              'AZURE_DEVOPS_CACHE_DIR' = 'C:\azureDevOpsCli\cache'
            }
            if ($AllowedAzureNames.Count -ne 0) {
              $actualAllowedAzureNames = @($AllowedAzureNames | Sort-Object -Unique)
              $expectedAllowedAzureNames = @(
                @($expectedHostedAzureTools.Keys) +
                @('AZURE_CLIENT_ID', 'AZURE_TENANT_ID', 'AZURE_FEDERATED_TOKEN_FILE') |
                  Sort-Object
              )
              if (($actualAllowedAzureNames -join [char]10) -cne
                  ($expectedAllowedAzureNames -join [char]10)) {
                throw 'The initial hosted Azure environment allowlist is not exact.'
              }
              foreach ($name in @($expectedHostedAzureTools.Keys)) {
                if ([Environment]::GetEnvironmentVariable($name, 'Process') -cne
                    $expectedHostedAzureTools[$name]) {
                  throw 'A hosted-runner Azure tool environment path drifted.'
                }
              }
              $protectedClientId = [Environment]::GetEnvironmentVariable(
                'SIGNING_AZURE_CLIENT_ID', 'Process'
              )
              $protectedTenantId = [Environment]::GetEnvironmentVariable(
                'SIGNING_AZURE_TENANT_ID', 'Process'
              )
              if ([string]::IsNullOrWhiteSpace($protectedClientId) -or
                  [string]::IsNullOrWhiteSpace($protectedTenantId)) {
                throw 'The protected signer identity is unavailable.'
              }
              foreach ($contract in @(
                @('AZURE_CLIENT_ID', $protectedClientId),
                @('AZURE_TENANT_ID', $protectedTenantId)
              )) {
                $ambientValue = [Environment]::GetEnvironmentVariable(
                  $contract[0], 'Process'
                )
                if (-not [string]::IsNullOrWhiteSpace($ambientValue) -and
                    $ambientValue -cne $contract[1]) {
                  throw 'A nonempty ambient workload identity does not match the protected signer identity.'
                }
              }
            }
            foreach ($forbidden in @(
              'AZURE_CLIENT_SECRET',
              'AZURE_CLIENT_CERTIFICATE_PATH',
              'AZURE_CLIENT_CERTIFICATE_PASSWORD',
              'AZURE_CLIENT_CERTIFICATE_SEND_CHAIN',
              'AZURE_CLIENT_SEND_CERTIFICATE_CHAIN',
              'AZURE_USERNAME',
              'AZURE_PASSWORD',
              'ARM_CLIENT_SECRET',
              'ARM_CLIENT_CERTIFICATE_PATH',
              'ARM_CLIENT_CERTIFICATE_PASSWORD',
              'ARM_CLIENT_CERTIFICATE_SEND_CHAIN',
              'ARM_USERNAME',
              'ARM_PASSWORD'
            )) {
              if (@($keys | Where-Object { $_.Equals(
                $forbidden, [StringComparison]::OrdinalIgnoreCase
              ) }).Count -ne 0) {
                throw 'An ambient secret, certificate, username, or password credential is forbidden.'
              }
            }
            $allowedAzure = [Collections.Generic.HashSet[string]]::new(
              [StringComparer]::OrdinalIgnoreCase
            )
            foreach ($name in $AllowedAzureNames) { [void]$allowedAzure.Add($name) }
            $allowedOidc = [Collections.Generic.HashSet[string]]::new(
              [StringComparer]::OrdinalIgnoreCase
            )
            foreach ($name in $AllowedOidcNames) { [void]$allowedOidc.Add($name) }
            $unexpectedAzureNames = @($keys | Where-Object {
              ($_.StartsWith('AZURE_', [StringComparison]::OrdinalIgnoreCase) -or
               $_.StartsWith('ARM_', [StringComparison]::OrdinalIgnoreCase)) -and
              -not $allowedAzure.Contains($_)
            } | Sort-Object -Unique)
            if ($unexpectedAzureNames.Count -ne 0) {
              if (@($unexpectedAzureNames | Where-Object {
                $_ -cnotmatch '^[A-Za-z0-9_]{1,128}$'
              }).Count -ne 0) {
                throw 'An unexpected ambient Azure identity environment variable is forbidden.'
              }
              throw ('Unexpected ambient Azure identity environment variable names are forbidden: ' +
                ($unexpectedAzureNames -join ', '))
            }
            foreach ($name in $keys) {
              if ($name -match '(?i)(?:^|_)(?:OIDC|ID_TOKEN|FEDERATED_TOKEN)(?:_|$)' -and
                  -not $allowedOidc.Contains($name) -and
                  -not $allowedAzure.Contains($name)) {
                throw 'An unexpected ambient OIDC token environment variable is forbidden.'
              }
            }
          }

          function Clear-SigningIdentityEnvironment {
            foreach ($name in @(
              'SIGNING_AZURE_CLIENT_ID', 'SIGNING_AZURE_TENANT_ID',
              'SIGNING_GITHUB_OWNER_ID', 'SIGNING_GITHUB_REPOSITORY_ID',
              'ARTIFACT_SIGNING_ENDPOINT', 'ARTIFACT_SIGNING_ACCOUNT_NAME',
              'ARTIFACT_SIGNING_CERTIFICATE_PROFILE_NAME',
              'AZURE_CONFIG_DIR', 'AZURE_EXTENSION_DIR', 'AZURE_DEVOPS_CACHE_DIR',
              'AZURE_CLIENT_ID', 'AZURE_TENANT_ID', 'AZURE_FEDERATED_TOKEN_FILE',
              'ACTIONS_ID_TOKEN_REQUEST_URL', 'ACTIONS_ID_TOKEN_REQUEST_TOKEN'
            )) {
              [Environment]::SetEnvironmentVariable($name, $null, 'Process')
              Remove-Item -LiteralPath ('Env:' + $name) -Force -ErrorAction SilentlyContinue
              if ($null -ne [Environment]::GetEnvironmentVariable($name, 'Process')) {
                throw 'A signer identity environment variable survived clearing.'
              }
            }
          }

          function ConvertFrom-BoundedOidcPayload {
            param([Parameter(Mandatory = $true)][string]$Token)

            if ($Token.Length -lt 128 -or $Token.Length -gt 32768 -or
                $Token -cnotmatch '^[A-Za-z0-9_-]+\.[A-Za-z0-9_-]+\.[A-Za-z0-9_-]+$') {
              throw 'GitHub returned a malformed OIDC token.'
            }
            $payloadText = $null
            $payloadBytes = $null
            try {
              $parts = $Token.Split('.')
              $encoded = $parts[1].Replace('-', '+').Replace('_', '/')
              switch ($encoded.Length % 4) {
                2 { $encoded += '==' }
                3 { $encoded += '=' }
                0 { }
                default { throw 'invalid' }
              }
              $payloadBytes = [Convert]::FromBase64String($encoded)
              if ($payloadBytes.Length -lt 2 -or $payloadBytes.Length -gt 16384) {
                throw 'invalid'
              }
              $payloadText = (New-Object Text.UTF8Encoding($false, $true)).GetString(
                $payloadBytes
              )
              return ($payloadText | ConvertFrom-Json -ErrorAction Stop)
            } catch {
              throw 'GitHub returned a malformed OIDC claim set.'
            } finally {
              if ($null -ne $payloadBytes) {
                [Array]::Clear($payloadBytes, 0, $payloadBytes.Length)
              }
              $payloadText = $null
              $payloadBytes = $null
            }
          }

          function Get-BoundedGitHubOidcToken {
            param(
              [Parameter(Mandatory = $true)][string]$Audience,
              [Parameter(Mandatory = $true)][string]$RequestUrlText,
              [Parameter(Mandatory = $true)][string]$RequestBearer
            )

            $responseBody = $null
            $responseBytes = $null
            $responseStream = $null
            $readCancellation = $null
            $handler = $null
            $body = $null
            $client = $null
            $request = $null
            $response = $null
            try {
              if ([string]::IsNullOrWhiteSpace($RequestUrlText) -or
                  $RequestUrlText.Length -gt 4096 -or
                  [string]::IsNullOrWhiteSpace($RequestBearer) -or
                  $RequestBearer.Length -gt 32768 -or
                  $RequestBearer -match '[\r\n]') {
                throw 'The GitHub OIDC request capability is missing or malformed.'
              }
              $requestUri = $null
              if (-not [Uri]::TryCreate($RequestUrlText, [UriKind]::Absolute, [ref]$requestUri) -or
                  $requestUri.Scheme -cne 'https' -or $requestUri.UserInfo -or
                  -not $requestUri.IsDefaultPort -or $requestUri.Fragment -or
                  (-not $requestUri.DnsSafeHost.Equals(
                    'token.actions.githubusercontent.com', [StringComparison]::OrdinalIgnoreCase
                  ) -and -not $requestUri.DnsSafeHost.EndsWith(
                    '.actions.githubusercontent.com', [StringComparison]::OrdinalIgnoreCase
                  )) -or $requestUri.Query -match '(?i)(?:^|[?&])audience=') {
                throw 'The GitHub OIDC request origin is not canonical.'
              }
              $builder = [UriBuilder]::new($requestUri)
              $existingQuery = $requestUri.Query.TrimStart('?')
              $audienceQuery = 'audience=' + [Uri]::EscapeDataString($Audience)
              $builder.Query = if ($existingQuery) {
                $existingQuery + '&' + $audienceQuery
              } else {
                $audienceQuery
              }
              $handler = [Net.Http.HttpClientHandler]::new()
              $handler.AllowAutoRedirect = $false
              $handler.UseCookies = $false
              $client = [Net.Http.HttpClient]::new($handler, $false)
              $client.Timeout = [TimeSpan]::FromSeconds(30)
              $request = [Net.Http.HttpRequestMessage]::new(
                [Net.Http.HttpMethod]::Get, $builder.Uri
              )
              $request.Headers.Authorization = [Net.Http.Headers.AuthenticationHeaderValue]::new(
                'Bearer', $RequestBearer
              )
              $response = $client.SendAsync(
                $request, [Net.Http.HttpCompletionOption]::ResponseHeadersRead
              ).GetAwaiter().GetResult()
              if ($response.StatusCode -ne [Net.HttpStatusCode]::OK -or
                  ($null -ne $response.Content.Headers.ContentLength -and
                   $response.Content.Headers.ContentLength -gt 65536)) {
                throw 'The GitHub OIDC token request failed.'
              }
              $responseBytes = [byte[]]::new(65537)
              $responseStream = $response.Content.ReadAsStreamAsync().GetAwaiter().GetResult()
              $readCancellation = [Threading.CancellationTokenSource]::new(
                [TimeSpan]::FromSeconds(30)
              )
              $totalBytes = 0
              while ($totalBytes -lt $responseBytes.Length) {
                $readBytes = $responseStream.ReadAsync(
                  $responseBytes, $totalBytes, ($responseBytes.Length - $totalBytes),
                  $readCancellation.Token
                ).GetAwaiter().GetResult()
                if ($readBytes -eq 0) { break }
                $totalBytes += $readBytes
              }
              if ($totalBytes -lt 1 -or $totalBytes -gt 65536) {
                throw 'The GitHub OIDC response was not bounded.'
              }
              $responseBody = (New-Object Text.UTF8Encoding($false, $true)).GetString(
                $responseBytes, 0, $totalBytes
              )
              if ([string]::IsNullOrWhiteSpace($responseBody) -or $responseBody.Length -gt 65536) {
                throw 'The GitHub OIDC response was not bounded.'
              }
              $body = $responseBody | ConvertFrom-Json -ErrorAction Stop
              $properties = @($body.PSObject.Properties.Name)
              if ($properties.Count -ne 1 -or $properties[0] -cne 'value') {
                throw 'The GitHub OIDC response shape was not exact.'
              }
              return [string]$body.value
            } catch {
              throw 'The bounded GitHub OIDC request failed without emitting response content.'
            } finally {
              $responseBody = $null
              $body = $null
              $requestUri = $null
              $builder = $null
              if ($null -ne $readCancellation) { $readCancellation.Dispose() }
              if ($null -ne $responseStream) { $responseStream.Dispose() }
              if ($null -ne $responseBytes) {
