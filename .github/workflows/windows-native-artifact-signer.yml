            }
            $runtime = Get-ItemProperty -LiteralPath (
              'HKLM:\SOFTWARE\Microsoft\VisualStudio\14.0\VC\Runtimes\x64'
            ) -ErrorAction Stop
            $versionText = [string]$runtime.Version
            if ([int]$runtime.Installed -ne 1 -or [int]$runtime.Major -ne 14 -or
                $versionText -cnotmatch
                  '^v(?<major>[0-9]+)\.(?<minor>[0-9]+)\.(?<build>[0-9]+)\.(?<revision>[0-9]+)$') {
              throw 'The x64 Microsoft Visual C++ Redistributable contract is missing.'
            }
            $runtimeVersion = [Version]::new(
              [int]$Matches.major, [int]$Matches.minor,
              [int]$Matches.build, [int]$Matches.revision
            )
            if ($runtimeVersion -lt [Version]'14.44.35211.0' -or
                [int]$runtime.Minor -ne $runtimeVersion.Minor -or
                [int]$runtime.Bld -ne $runtimeVersion.Build -or
                [int]$runtime.Rbld -ne $runtimeVersion.Revision) {
              throw 'The x64 Microsoft Visual C++ Redistributable is below the reviewed floor.'
            }
            $records = [Collections.Generic.List[string]]::new()
            $tab = [char]9
            foreach ($name in @(
              'msvcp140.dll', 'vcruntime140.dll', 'vcruntime140_1.dll'
            )) {
              $path = Join-Path $systemDirectory $name
              $item = Get-Item -LiteralPath $path -Force -ErrorAction Stop
              if ($item.PSIsContainer -or
                  ($item.Attributes -band [IO.FileAttributes]::ReparsePoint) -ne 0 -or
                  $item.Length -lt 32768 -or $item.Length -gt 2097152 -or
                  $item.VersionInfo.CompanyName -cne 'Microsoft Corporation' -or
                  [Version]$item.VersionInfo.FileVersion -ne $runtimeVersion) {
                throw 'An Artifact Signing VC++ prerequisite file contract failed.'
              }
              $signature = Get-AuthenticodeSignature -LiteralPath $path
              if ($signature.Status -ne 'Valid' -or
                  $null -eq $signature.SignerCertificate -or
                  $signature.SignerCertificate.Subject -cnotmatch
                    '(?:^|, )O=Microsoft Corporation(?:,|$)') {
                throw 'An Artifact Signing VC++ prerequisite is not Microsoft-authenticated.'
              }
              $hash = (Get-FileHash -LiteralPath $path -Algorithm SHA256).Hash.ToLowerInvariant()
              $records.Add(
                $name + $tab +
                $item.Length.ToString([Globalization.CultureInfo]::InvariantCulture) + $tab +
                $runtimeVersion.ToString() + $tab + $hash
              )
            }
            $recordArray = $records.ToArray()
            [Array]::Sort($recordArray, [StringComparer]::Ordinal)
            $payload = (New-Object Text.UTF8Encoding($false, $true)).GetBytes(
              'registry' + $tab + $runtimeVersion.ToString() + [char]10 +
                ($recordArray -join [char]10) + [char]10
